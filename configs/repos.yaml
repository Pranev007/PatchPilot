# Benchmark repositories -- CURATED, not candidates.
#
# Every repo below was validated with `patchpilot run --max-iterations 1`,
# which establishes a Python 3.8 baseline and runs the suite once on 3.12
# without ever calling the model. Each one:
#
#   * builds and collects a passing test suite on 3.8 (baseline size below)
#   * regresses on 3.12, so there is genuine migration work to do
#   * installs its test-only dependencies, taken from its CI config or read
#     off the collection errors during validation
#
# Repos that were already green on 3.12 at their pinned ref were REMOVED:
# they have nothing to migrate and would inflate the success rate for free.
# Dropped for that reason (14 of 36 scouted), including jaraco/zipp and
# more-itertools, which only looked like failures until the subtest-outcome
# bug in the parser was fixed.
#
# Re-validate after any edit here. It costs nothing:
#     patchpilot run --max-iterations 1

defaults:
  from_python: "3.8"
  to_python: "3.12"
  install:
    - "uv pip install -e ."
  test: "python -m pytest"

repos:
  - name: Delgan/loguru
    url: https://github.com/Delgan/loguru
    ref: "0.6.0"
    notes: >
      1328 tests pass on 3.8; suite regresses on 3.12. Tagged 2022-01-29. CI matrix tops out at 3.8, 3.9, 3.10.

  - name: python-attrs/attrs
    url: https://github.com/python-attrs/attrs
    ref: "21.4.0.post1"
    install:
      # One command, not two: hypothesis depends on attrs, so installing it
      # after `-e .` pulls a released attrs from PyPI and silently replaces
      # the editable checkout -- the suite then tests the wrong code.
      - "uv pip install -e . hypothesis zope.interface pympler cloudpickle six"
    notes: >
      1161 tests pass on 3.8; suite regresses on 3.12. Tagged 2022-02-02. CI matrix tops out at 3.8, 3.9, 3.10.

  - name: pallets/click
    url: https://github.com/pallets/click
    ref: "8.1.3"
    install:
      - "uv pip install -e ."
      - "uv pip install -r requirements/tests.txt"
    notes: >
      568 tests pass on 3.8; suite regresses on 3.12. Tagged 2022-04-28. CI matrix tops out at 3.9, 3.10, 3.11.

  - name: python-humanize/humanize
    url: https://github.com/python-humanize/humanize
    ref: "4.2.3"
    install:
      - "uv pip install -e ."
      - "uv pip install freezegun"
    notes: >
      437 tests pass on 3.8; suite regresses on 3.12. Tagged 2022-06-30. CI matrix tops out at 3.9, 3.10, 3.11.

  - name: mahmoud/boltons
    url: https://github.com/mahmoud/boltons
    ref: "21.0.0"
    notes: >
      389 tests pass on 3.8; suite regresses on 3.12. Tagged 2021-05-16. CI matrix tops out at 3.7, 3.8, 3.9.

  - name: pallets/itsdangerous
    url: https://github.com/pallets/itsdangerous
    ref: "2.1.2"
    install:
      - "uv pip install -e ."
      - "uv pip install -r requirements/tests.txt"
    notes: >
      297 tests pass on 3.8; suite regresses on 3.12. Tagged 2022-03-24. CI matrix tops out at 3.9, 3.10, 3.11.

  - name: pyeve/cerberus
    url: https://github.com/pyeve/cerberus
    ref: "1.3.4"
    install:
      - "uv pip install -e ."
      - "uv pip install pytest-benchmark"
    notes: >
      242 tests pass on 3.8; suite regresses on 3.12. Tagged 2021-05-05. CI matrix tops out at 3.7, 3.8, 3.9.

  - name: agronholm/typeguard
    url: https://github.com/agronholm/typeguard
    ref: "2.13.3"
    notes: >
      235 tests pass on 3.8; suite regresses on 3.12. Tagged 2021-12-10. CI matrix tops out at 3.8, 3.9, 3.10.

  - name: pytoolz/toolz
    url: https://github.com/pytoolz/toolz
    ref: "0.11.2"
    notes: >
      203 tests pass on 3.8; suite regresses on 3.12. Tagged 2021-11-06. CI matrix tops out at 3.8, 3.9, 3.10.

  - name: scrapy/w3lib
    url: https://github.com/scrapy/w3lib
    ref: "v1.22.0"
    notes: >
      144 tests pass on 3.8; suite regresses on 3.12. Tagged 2020-05-13. CI matrix tops out at 3.6, 3.7, 3.8.

  - name: PyCQA/pycodestyle
    url: https://github.com/PyCQA/pycodestyle
    ref: "2.8.0"
    notes: >
      54 tests pass on 3.8; suite regresses on 3.12. Tagged 2021-10-10. CI matrix tops out at 3.8, 3.9, 3.10.

  - name: john-kurkowski/tldextract
    url: https://github.com/john-kurkowski/tldextract
    ref: "3.3.0"
    install:
      - "uv pip install -e ."
      - "uv pip install responses"
    notes: >
      47 tests pass on 3.8; suite regresses on 3.12. Tagged 2022-05-04. CI matrix tops out at 3.8, 3.9, 3.10.
