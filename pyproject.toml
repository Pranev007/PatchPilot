[project]
name = "patchpilot"
version = "0.1.0"
description = "PatchPilot: an agentic system for test-verified dependency migration"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Only needed for `patchpilot sweep` to emit sweep.png. The CSV and the
# markdown table are produced without it.
plot = ["matplotlib>=3.8"]
# Needed for every non-Anthropic provider (Gemini, DeepSeek,
# OpenRouter, Together, HuggingFace, OpenAI).
openai = ["openai>=1.60"]

[project.scripts]
patchpilot = "patchpilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patchpilot"]
