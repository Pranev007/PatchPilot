[project]
name = "migration-agent"
version = "0.1.0"
description = "Test-verified dependency migration agent: Python 3.8 -> 3.12"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Only needed for `migrate sweep` to emit sweep.png. The CSV and the
# markdown table are produced without it.
plot = ["matplotlib>=3.8"]

[project.scripts]
migrate = "migrator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/migrator"]
